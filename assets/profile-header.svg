<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Vyshnavi DP — Software Engineer and AI Engineer</title>
  <desc id="desc">Agentic AI, evaluation, and backend systems. A connected plan, tool, and evaluation diagram on a navy background with teal and lavender accents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#111b2e"/><stop offset="1" stop-color="#172e3a"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#7891a8" opacity=".16"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="20" fill="url(#dots)"/>
  <rect x="44" y="50" width="5" height="196" rx="2.5" fill="#5eead4"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="74" y="76" font-size="15" font-weight="700" letter-spacing="3" fill="#5eead4">BUILD · TEST · UNDERSTAND</text>
    <text x="70" y="150" font-size="64" font-weight="700" fill="#f8fafc">Vyshnavi DP</text>
    <text x="74" y="190" font-size="25" fill="#d9e3ee">Software Engineer · AI Engineer</text>
    <text x="74" y="230" font-size="18" fill="#a9bccd">Agentic AI / LLM evaluation / Backend systems</text>
    <rect x="792" y="44" width="354" height="212" rx="16" fill="#101b2b" stroke="#345063"/>
    <circle cx="812" cy="64" r="4" fill="#5eead4"/>
    <circle cx="828" cy="64" r="4" fill="#c4b5fd"/>
    <circle cx="844" cy="64" r="4" fill="#64748b"/>
    <text x="1082" y="69" font-size="13" fill="#849bad">v.dp</text>
    <path d="M831 107 V213" stroke="#3d6572" stroke-width="2"/>
    <g font-family="monospace" font-size="20">
      <circle cx="831" cy="107" r="7" fill="#5eead4"/>
      <text x="853" y="113" fill="#d6faf4">plan()</text>
      <circle cx="831" cy="157" r="7" fill="#c4b5fd"/>
      <text x="853" y="163" fill="#e4ddff">call_tool()</text>
      <circle cx="831" cy="207" r="7" fill="#5eead4"/>
      <text x="853" y="213" fill="#d6faf4">evaluate()</text>
    </g>
  </g>
</svg>
